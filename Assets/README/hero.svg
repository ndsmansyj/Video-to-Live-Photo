<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#ECEFF5"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="132" y1="118" x2="874" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20242B"/>
      <stop offset=".55" stop-color="#111318"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="ring" x1="280" y1="300" x2="754" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BE7FF"/>
      <stop offset=".48" stop-color="#6798FF"/>
      <stop offset="1" stop-color="#9B72FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="36" fill="url(#panel)"/>

  <g transform="translate(102 72) scale(.37)" filter="url(#shadow)">
    <rect x="72" y="72" width="880" height="880" rx="222" fill="url(#iconbg)"/>
    <path d="M318 601 A230 230 0 1 1 658 711" fill="none" stroke="url(#ring)" stroke-width="62" stroke-linecap="round"/>
    <path d="M373 584 A165 165 0 1 1 621 655" fill="none" stroke="#F6F8FF" stroke-opacity=".95" stroke-width="44" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="34" fill="#F8FAFF"/>
    <path d="M658 711 C704 683 744 645 772 601" fill="none" stroke="url(#ring)" stroke-width="62" stroke-linecap="round"/>
    <path d="M710 592 L790 576 L774 656" fill="none" stroke="url(#ring)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#17191D">
    <text x="540" y="198" font-size="64" font-weight="760">SPP Live Export</text>
    <text x="544" y="260" font-size="28" font-weight="520" fill="#555C67">DaVinci → Live Photo → AirDrop → iPhone</text>
    <text x="544" y="324" font-size="21" fill="#727985">Native macOS · Local processing · No Photos library · No iCloud required</text>
    <g transform="translate(544 366)">
      <rect width="190" height="48" rx="24" fill="#17191D"/>
      <text x="95" y="31" text-anchor="middle" font-size="17" font-weight="650" fill="#FFFFFF">macOS 13+</text>
      <rect x="208" width="226" height="48" rx="24" fill="#FFFFFF" stroke="#D7DBE2"/>
      <text x="321" y="31" text-anchor="middle" font-size="17" font-weight="650" fill="#31353C">Apple Silicon</text>
    </g>
  </g>
</svg>
