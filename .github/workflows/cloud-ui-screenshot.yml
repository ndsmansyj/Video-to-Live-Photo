name: UI Snapshots

on:
  push:
    branches-ignore:
      - main
    paths:
      - "Sources/**"
      - "Assets/Brand/**"
      - "Info.plist"
      - "scripts/build.sh"
      - "scripts/find_window_id.swift"
      - ".github/workflows/cloud-ui-screenshot.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Assets/Brand/**"
      - "Info.plist"
      - "scripts/build.sh"
      - "scripts/find_window_id.swift"
      - ".github/workflows/cloud-ui-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-turbo-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build app
        run: ./scripts/build.sh

      - name: Capture app pages
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/dist/Video to Live Turbo.app"
          mkdir -p ui-captures

          for page in recent history settings about; do
            open -na "$APP" --args --ui-page "$page"

            window_id=""
            for attempt in {1..20}; do
              sleep 1
              window_id="$(swift scripts/find_window_id.swift "Video to Live Turbo" 2>/dev/null || true)"
              [[ -n "$window_id" ]] && break
            done

            [[ -n "$window_id" ]] || { echo "No app window found for page: $page" >&2; exit 1; }
            screencapture -x -o -l "$window_id" "ui-captures/${page}.png"
            file "ui-captures/${page}.png"
            killall "Video to Live Turbo" || true
            sleep 1
          done

          ls -lh ui-captures

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: live-turbo-ui-pages
          path: ui-captures/*.png
          if-no-files-found: error
          retention-days: 3
